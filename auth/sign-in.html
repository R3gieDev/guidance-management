<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Guidance | Sign-in</title>

    <link rel="stylesheet" href="../assets/css/style.css" />
    <link rel="stylesheet" href="../assets/css/pages/sign-in.css" />
  </head>

  <body class="d-flex flex-row h-screen bg-light">
    <div class="p-10 d-flex flex-column flex-1 right-container">
      <header class="d-flex items-center gap-2">
        <img class="w-80 h-80" src="../assets/images/logo/britech-logo.png" alt="Britech College" />
        <div class="d-flex flex-column gap-1 text-white">
          <h1>Britech College</h1>
          <p>White Rose, Yati, Liloan, Cebu, 6000</p>
        </div>
      </header>

      <section class="mt-12 d-flex flex-column text-white">
        <p class="text-lg font-semibold">WEB-BASED GUIDANCE MANAGEMENT SYSTEM</p>

        <h1 class="mt-5 text-5xl font-bold mb-6">
          Simple, Fast &
          <span class=""> Secure </span>
          Guidance Services
        </h1>

        <p class="text-lg">
          A web-based system designed to provide easy, quick, and safe access to guidance services and student records
          at Britech College.
        </p>
      </section>
    </div>

    <div class="d-flex flex-column flex-1 items-center justify-center">
      <form class="w-75">
        <a class="mb-2 btn-tertiary" href="../index.html"><i class="mr-1 fa-solid fa-arrow-left-long"></i>Return</a>
        <h1 class="mb-6 text-32">Welcome Back! 👋</h1>
        <!-- Username -->
        <div class="mb-6">
          <label for="username" class="label"><span class="mr-2 fa-solid fa-user"></span>Username</label>
          <input class="mt-2 input" type="text" id="username" name="username" placeholder="Enter your username" />
        </div>

        <div class="mb-6">
          <label for="password" class="label"><span class="mr-2 fa-solid fa-lock"></span>Password</label>
          <input class="mt-2 input" type="text" id="password" name="password" placeholder="Enter your password" />
        </div>

            <a href="../pages/dashboard.html" class="w-100 btn-primary btn-login" type="submit">
              Log In
            </a>
      </form>
    </div>
  </body>
</html>
